<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">AAAC Overview</title>
  <desc id="desc">Overview of Action-Aware Adaptive Consistency with a fixed LeWM backbone, a difficulty head, an action-aware gate, and a weighted consistency objective.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c647a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c6cbf"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9831e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9a64"/>
    </marker>
    <style>
      .title { font: 700 30px Helvetica, Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 16px Helvetica, Arial, sans-serif; fill: #506174; }
      .panel-title { font: 700 20px Helvetica, Arial, sans-serif; fill: #17324d; }
      .panel-sub { font: 400 14px Helvetica, Arial, sans-serif; fill: #607283; }
      .label { font: 600 15px Helvetica, Arial, sans-serif; fill: #24415d; }
      .body { font: 400 14px Helvetica, Arial, sans-serif; fill: #31485d; }
      .small { font: 400 12px Helvetica, Arial, sans-serif; fill: #5f7184; }
      .formula { font: 600 17px "Courier New", monospace; fill: #17324d; }
      .formula-small { font: 600 15px "Courier New", monospace; fill: #17324d; }
      .footer { font: 600 14px Helvetica, Arial, sans-serif; fill: #17324d; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#ffffff"/>
  <rect x="24" y="24" width="1552" height="932" rx="26" fill="#fcfdff" stroke="#d9e2ec" stroke-width="2"/>

  <text x="800" y="70" text-anchor="middle" class="title">Action-Aware Adaptive Consistency (AAAC)</text>
  <text x="800" y="98" text-anchor="middle" class="subtitle">LeWM backbone unchanged; sigma estimates difficulty, A_t measures controllability, and w_t modulates token-wise consistency.</text>

  <rect x="48" y="132" width="470" height="580" rx="24" fill="#f7fbff" stroke="#cddfed" stroke-width="2"/>
  <rect x="564" y="132" width="470" height="580" rx="24" fill="#fffaf2" stroke="#ecd7b3" stroke-width="2"/>
  <rect x="1080" y="132" width="472" height="580" rx="24" fill="#f6fcf8" stroke="#cae5d6" stroke-width="2"/>

  <circle cx="88" cy="168" r="18" fill="#2c6cbf"/>
  <text x="88" y="174" text-anchor="middle" style="font:700 16px Helvetica, Arial, sans-serif; fill:#ffffff;">1</text>
  <text x="118" y="176" class="panel-title">Difficulty Head + Probe Calibration</text>
  <text x="118" y="198" class="panel-sub">Adds a scalar uncertainty head without changing the shared mean path.</text>

  <circle cx="604" cy="168" r="18" fill="#c9831e"/>
  <text x="604" y="174" text-anchor="middle" style="font:700 16px Helvetica, Arial, sans-serif; fill:#ffffff;">2</text>
  <text x="634" y="176" class="panel-title">Action-Aware Gate</text>
  <text x="634" y="198" class="panel-sub">Combines difficulty and controllability into a per-token controller.</text>

  <circle cx="1120" cy="168" r="18" fill="#2e9a64"/>
  <text x="1120" y="174" text-anchor="middle" style="font:700 16px Helvetica, Arial, sans-serif; fill:#ffffff;">3</text>
  <text x="1150" y="176" class="panel-title">Adaptive Consistency Loss</text>
  <text x="1150" y="198" class="panel-sub">Strengthens invariance on redundant tokens and relaxes it on critical ones.</text>

  <rect x="76" y="234" width="148" height="110" rx="16" fill="#ffffff" stroke="#cfdae6" stroke-width="2"/>
  <text x="150" y="258" text-anchor="middle" class="label">clean view x</text>
  <rect x="99" y="278" width="30" height="30" rx="6" fill="#94c2f0"/>
  <rect x="136" y="278" width="30" height="30" rx="6" fill="#61a5e8"/>
  <rect x="173" y="278" width="30" height="30" rx="6" fill="#2c6cbf"/>
  <rect x="117" y="312" width="30" height="18" rx="4" fill="#d6e9fb"/>
  <rect x="154" y="312" width="30" height="18" rx="4" fill="#b8d7f6"/>

  <rect x="76" y="390" width="148" height="110" rx="16" fill="#ffffff" stroke="#cfdae6" stroke-width="2"/>
  <text x="150" y="414" text-anchor="middle" class="label">noisy view x'</text>
  <rect x="99" y="434" width="30" height="30" rx="6" fill="#f1d2aa"/>
  <rect x="136" y="434" width="30" height="30" rx="6" fill="#efbb74"/>
  <rect x="173" y="434" width="30" height="30" rx="6" fill="#df9d41"/>
  <circle cx="112" cy="442" r="3" fill="#ffffff"/>
  <circle cx="161" cy="456" r="3" fill="#ffffff"/>
  <circle cx="184" cy="440" r="3" fill="#ffffff"/>
  <rect x="117" y="468" width="30" height="18" rx="4" fill="#f7e8d0"/>
  <rect x="154" y="468" width="30" height="18" rx="4" fill="#f3d9b0"/>

  <rect x="280" y="298" width="180" height="132" rx="18" fill="#e8f1fb" stroke="#8eb8e6" stroke-width="2.5"/>
  <text x="370" y="338" text-anchor="middle" class="panel-title">shared encoder</text>
  <text x="370" y="364" text-anchor="middle" class="body">same LeWM backbone</text>
  <text x="370" y="388" text-anchor="middle" class="small">clean / noisy views share weights</text>

  <line x1="224" y1="289" x2="280" y2="330" stroke="#4c647a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="224" y1="445" x2="280" y2="398" stroke="#4c647a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="80" y="548" width="378" height="116" rx="16" fill="#ffffff" stroke="#d4dee8" stroke-width="1.5"/>
  <text x="104" y="578" class="label">Base JEPA objective remains intact</text>
  <text x="104" y="605" class="formula-small">L_base = L_pred + lambda_SIGReg * SIGReg(mu)</text>
  <text x="104" y="632" class="small">When sigma_hat = 0 and alpha = 0, the method exactly reduces to LeWM.</text>

  <rect x="620" y="238" width="160" height="88" rx="14" fill="#ffffff" stroke="#cfdae6" stroke-width="2"/>
  <text x="700" y="266" text-anchor="middle" class="label">context token z_t</text>
  <rect x="645" y="285" width="22" height="22" rx="5" fill="#9dc6ef"/>
  <rect x="673" y="285" width="22" height="22" rx="5" fill="#6eaeea"/>
  <rect x="701" y="285" width="22" height="22" rx="5" fill="#2c6cbf"/>
  <rect x="729" y="285" width="22" height="22" rx="5" fill="#1c508d"/>

  <rect x="620" y="360" width="160" height="70" rx="14" fill="#ffffff" stroke="#cfdae6" stroke-width="2"/>
  <text x="700" y="402" text-anchor="middle" class="label">action a_t</text>

  <rect x="826" y="248" width="164" height="104" rx="16" fill="#fff4df" stroke="#e4ba72" stroke-width="2"/>
  <text x="908" y="280" text-anchor="middle" class="label">predictor f(z_t, a_t)</text>
  <text x="908" y="304" text-anchor="middle" class="small">shared mean path</text>
  <line x1="780" y1="286" x2="826" y2="286" stroke="#c9831e" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <line x1="780" y1="394" x2="838" y2="326" stroke="#c9831e" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <rect x="612" y="470" width="182" height="86" rx="14" fill="#ffffff" stroke="#d9e0e6" stroke-width="2"/>
  <text x="703" y="498" text-anchor="middle" class="label">perturbed action</text>
  <text x="703" y="524" text-anchor="middle" class="formula-small">a_t + delta   (K = 4)</text>

  <rect x="842" y="404" width="148" height="82" rx="14" fill="#ffffff" stroke="#e0c791" stroke-width="2"/>
  <text x="916" y="432" text-anchor="middle" class="label">difficulty head</text>
  <text x="916" y="458" text-anchor="middle" class="formula-small">sigma_hat_t</text>

  <rect x="842" y="510" width="148" height="82" rx="14" fill="#ffffff" stroke="#e0c791" stroke-width="2"/>
  <text x="916" y="538" text-anchor="middle" class="label">action response</text>
  <text x="916" y="564" text-anchor="middle" class="formula-small">A^(k)_t</text>

  <line x1="908" y1="352" x2="908" y2="404" stroke="#c9831e" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <line x1="794" y1="516" x2="842" y2="548" stroke="#c9831e" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <line x1="780" y1="302" x2="844" y2="302" stroke="#d9dfe5" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="780" y1="514" x2="844" y2="514" stroke="#d9dfe5" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="620" y="600" width="368" height="72" rx="14" fill="#fff4df" stroke="#e4ba72" stroke-width="1.5"/>
  <text x="804" y="626" text-anchor="middle" class="formula-small">A_mean = mean_k A^(k)_t</text>
  <text x="804" y="648" text-anchor="middle" class="formula-small">A_eff = A_mean / (1 + alpha_cv * A_cv)</text>

  <rect x="1120" y="238" width="392" height="224" rx="18" fill="#ffffff" stroke="#d5e6db" stroke-width="2"/>
  <text x="1146" y="272" class="label">difficulty + controllability -> token weight</text>
  <text x="1146" y="314" class="formula">gS_t = zscore(sigma_hat_t)</text>
  <text x="1146" y="348" class="formula">gA_t = zscore(log A_eff_t)</text>
  <text x="1146" y="382" class="formula">critical_t = gA_t * (0.5 + 0.5 * gS_t)</text>
  <text x="1146" y="416" class="formula">w_t = clip(1 - alpha * critical_t, w_min, w_max)</text>
  <text x="1146" y="444" class="small">high sigma_hat + high A_t  -> low w_t  -> preserve resolution</text>

  <line x1="990" y1="444" x2="1120" y2="336" stroke="#c9831e" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <line x1="990" y1="551" x2="1120" y2="369" stroke="#c9831e" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <rect x="1120" y="500" width="172" height="112" rx="16" fill="#ffffff" stroke="#cae5d6" stroke-width="2"/>
  <text x="1206" y="530" text-anchor="middle" class="label">clean tokens z_clean</text>
  <rect x="1148" y="548" width="22" height="22" rx="5" fill="#94c2f0"/>
  <rect x="1178" y="548" width="22" height="22" rx="5" fill="#61a5e8"/>
  <rect x="1208" y="548" width="22" height="22" rx="5" fill="#2c6cbf"/>
  <rect x="1238" y="548" width="22" height="22" rx="5" fill="#1d4f87"/>
  <text x="1206" y="598" text-anchor="middle" class="small">stop-grad reference</text>

  <rect x="1340" y="500" width="172" height="112" rx="16" fill="#ffffff" stroke="#cae5d6" stroke-width="2"/>
  <text x="1426" y="530" text-anchor="middle" class="label">noisy tokens z_noisy</text>
  <rect x="1368" y="548" width="22" height="22" rx="5" fill="#f1d2aa"/>
  <rect x="1398" y="548" width="22" height="22" rx="5" fill="#efbb74"/>
  <rect x="1428" y="548" width="22" height="22" rx="5" fill="#df9d41"/>
  <rect x="1458" y="548" width="22" height="22" rx="5" fill="#c9831e"/>
  <text x="1426" y="598" text-anchor="middle" class="small">encoder receives consistency pressure</text>

  <line x1="1292" y1="556" x2="1340" y2="556" stroke="#2e9a64" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1306" y="544" text-anchor="middle" class="formula-small">d(.,.)</text>

  <line x1="1120" y1="392" x2="1206" y2="500" stroke="#2e9a64" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="1290" y1="418" x2="1426" y2="500" stroke="#2e9a64" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="1172" y="640" width="290" height="98" rx="16" fill="#e9f7ef" stroke="#8fcca8" stroke-width="2"/>
  <text x="1317" y="672" text-anchor="middle" class="label">adaptive consistency loss</text>
  <text x="1317" y="704" text-anchor="middle" class="formula-small">L_cons = mean( w_t * d(z_clean, z_noisy) )</text>
  <text x="1317" y="726" text-anchor="middle" class="small">only the noisy branch is updated by L_cons</text>

  <rect x="80" y="748" width="1430" height="160" rx="22" fill="#f8fafc" stroke="#dce4eb" stroke-width="2"/>
  <text x="110" y="786" class="panel-title">Behavioral intuition and main takeaway</text>

  <rect x="110" y="812" width="420" height="72" rx="14" fill="#eef5fd" stroke="#c6daf0" stroke-width="1.5"/>
  <text x="130" y="838" class="footer">contact-heavy states</text>
  <text x="130" y="862" class="body">high sigma_hat + high A_t  -> low w_t -> weaker consistency -> preserve planning resolution</text>

  <rect x="590" y="812" width="420" height="72" rx="14" fill="#fff7e8" stroke="#ead3a2" stroke-width="1.5"/>
  <text x="610" y="838" class="footer">redundant states</text>
  <text x="610" y="862" class="body">low A_t or mostly visual noise -> high w_t -> stronger invariance and robustness</text>

  <rect x="1070" y="812" width="408" height="72" rx="14" fill="#eef8f1" stroke="#cbe5d2" stroke-width="1.5"/>
  <text x="1090" y="838" class="footer">main takeaway</text>
  <text x="1090" y="862" class="body">The per-token gate is most necessary on contact-heavy control; elsewhere it refines global consistency.</text>

  <line x1="1210" y1="612" x2="1210" y2="640" stroke="#c43c35" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="1130" y="630" class="small" fill="#c43c35">stop-grad</text>

  <line x1="518" y1="422" x2="564" y2="422" stroke="#4c647a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1034" y1="422" x2="1080" y2="422" stroke="#4c647a" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
